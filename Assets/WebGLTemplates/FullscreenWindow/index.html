<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
</head>

<body style="margin: 0px; overflow: hidden; background-color: black;" oncontextmenu="return false;">
  <canvas id="unity-canvas" width="1920" height="1080"
    style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}">
  </canvas>

  <div id="progress-bar" style="position: absolute; left: 0%; right: 100%; top: 49%; bottom: 49%; background-color: white;"></div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");

    function resizeCanvas() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      canvas.style.width = (1920 * scale) + "px";
      canvas.style.height = (1080 * scale) + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const settings = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      #if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      #endif
      #if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
      #endif
      #if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
      #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1,
    };

    const progressBar = document.querySelector("#progress-bar");
	
	DisableSelecting();

    createUnityInstance(document.querySelector("#unity-canvas"), settings, (progress) => {
      progressBar.style.right = 100 * (1 - progress) + "%";
    }).then(() => {
      progressBar.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
	
	function DisableSelecting(){
		const style = window.document.createElement('style');
	
		style.textContent = `
			* {
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				-khtml-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}
		`;

		window.document.head.appendChild(style);
	}
  </script>
</body>

</html>
